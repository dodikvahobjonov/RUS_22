<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="Zakovat - Interaktiv test platformasi">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zakovat - Interaktiv Test Platformasi</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiWmFrb3ZhdCIsInNob3J0X25hbWUiOiJaYWtvdmF0IiwiZGVzY3JpcHRpb24iOiJJbnRlcmFrdGl2IHRlc3QgcGxhdGZvcm1hc2kiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBmMDcxNyIsInRoZW1lX2NvbG9yIjoiIzdjM2FlZCJ9">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f0717;--bg2:#1a0e2e;--bg3:#241545;--bg4:#2e1d56;--primary:#7c3aed;--primary2:#a855f7;--primary3:#c084fc;--accent:#f59e0b;--accent2:#fbbf24;--success:#10b981;--danger:#ef4444;--info:#3b82f6;--text:#f8fafc;--text2:#cbd5e1;--text3:#94a3b8;--text4:#64748b;--border:#3b2063;--shadow:0 4px 24px rgba(124,58,237,.15);--radius:12px;--radius2:16px;--transition:all .3s cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
a{color:var(--primary2);text-decoration:none;transition:var(--transition)}
a:hover{color:var(--primary3)}
button{cursor:pointer;font-family:inherit;transition:var(--transition)}
input,textarea,select{font-family:inherit;transition:var(--transition)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--primary2)}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--primary),0 0 10px var(--primary)}50%{box-shadow:0 0 20px var(--primary),0 0 40px var(--primary)}}
@keyframes countDown{from{transform:scale(1.5);opacity:1}to{transform:scale(1);opacity:.8}}

.animate-fade{animation:fadeIn .5s ease}
.animate-slide{animation:slideIn .5s ease}
.animate-scale{animation:scaleIn .4s ease}
.animate-pulse{animation:pulse 2s infinite}
.animate-float{animation:float 3s ease-in-out infinite}
.animate-spin{animation:spin 1s linear infinite}
.animate-glow{animation:glow 2s infinite}

/* Layout */
.app{min-height:100vh;display:flex;flex-direction:column}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(15,7,23,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:12px;font-size:1.4rem;font-weight:800;color:var(--primary2)}
.nav-brand .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.nav-links{display:flex;align-items:center;gap:8px}
.nav-link{padding:8px 16px;border-radius:8px;color:var(--text2);font-size:.9rem;font-weight:500;border:none;background:transparent}
.nav-link:hover,.nav-link.active{background:var(--bg3);color:var(--primary2)}
.nav-user{display:flex;align-items:center;gap:12px}
.nav-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;cursor:pointer}
.nav-hamburger{display:none;background:none;border:none;color:var(--text);font-size:1.5rem;padding:8px}

.main{margin-top:64px;padding:24px;max-width:1400px;margin-left:auto;margin-right:auto;width:100%}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:24px;transition:var(--transition)}
.card:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:1.2rem;font-weight:700;color:var(--text)}
.card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius);font-weight:600;font-size:.95rem;border:none;transition:var(--transition)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(124,58,237,.4)}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary2)}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(16,185,129,.4)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(239,68,68,.4)}
.btn-sm{padding:8px 16px;font-size:.85rem}
.btn-lg{padding:16px 32px;font-size:1.1rem}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Forms */
.form-group{margin-bottom:20px}
.form-label{display:block;margin-bottom:8px;font-weight:600;color:var(--text2);font-size:.9rem}
.form-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.95rem;outline:none}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.form-input::placeholder{color:var(--text4)}
textarea.form-input{min-height:100px;resize:vertical}
select.form-input{cursor:pointer}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-primary{background:rgba(124,58,237,.2);color:var(--primary2)}
.badge-success{background:rgba(16,185,129,.2);color:var(--success)}
.badge-danger{background:rgba(239,68,68,.2);color:var(--danger)}
.badge-accent{background:rgba(245,158,11,.2);color:var(--accent)}
.badge-info{background:rgba(59,130,246,.2);color:var(--info)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg3);color:var(--text2);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px}
td{font-size:.9rem;color:var(--text2)}
tr:hover td{background:rgba(124,58,237,.05)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:scaleIn .3s ease}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:1.2rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--text3);font-size:1.3rem;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px}

/* Toast */
.toast-container{position:fixed;top:80px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{padding:14px 20px;border-radius:var(--radius);color:#fff;font-weight:500;font-size:.9rem;animation:slideInRight .3s ease;display:flex;align-items:center;gap:10px;min-width:280px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast-success{background:linear-gradient(135deg,#059669,#10b981)}
.toast-error{background:linear-gradient(135deg,#dc2626,#ef4444)}
.toast-info{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.toast-warning{background:linear-gradient(135deg,#d97706,#f59e0b)}

/* Home Page */
.hero{text-align:center;padding:60px 20px;position:relative}
.hero-title{font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--primary2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
.hero-sub{font-size:1.2rem;color:var(--text3);margin-bottom:40px;max-width:600px;margin-left:auto;margin-right:auto}
.hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:900px;margin:0 auto 40px}
.hero-card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius2);padding:32px;cursor:pointer;text-align:center;transition:var(--transition)}
.hero-card:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:0 12px 40px rgba(124,58,237,.2)}
.hero-card-icon{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px}
.hero-card-title{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.hero-card-desc{color:var(--text3);font-size:.95rem}
.hero-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:1000px;margin:0 auto;padding:0 20px}
.hero-feature{display:flex;align-items:center;gap:12px;padding:16px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border)}
.hero-feature-icon{font-size:1.5rem}
.hero-feature-text{font-size:.9rem;color:var(--text2)}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;display:flex;align-items:center;gap:16px}
.stat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.stat-info{flex:1}
.stat-value{font-size:1.8rem;font-weight:800}
.stat-label{color:var(--text3);font-size:.85rem}

/* Test Room */
.room-code-display{font-size:2.5rem;font-weight:900;letter-spacing:8px;color:var(--accent);text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);border:2px dashed var(--border);margin:16px 0}
.players-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.player-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.player-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.player-name{font-weight:600;font-size:.9rem}
.player-score{color:var(--accent);font-weight:700}

/* Timer */
.timer{font-size:3rem;font-weight:900;text-align:center;padding:16px}
.timer.warning{color:var(--danger);animation:pulse .5s infinite}
.timer-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0}
.timer-bar-fill{height:100%;border-radius:3px;transition:width 1s linear}

/* Question */
.question-card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius2);padding:32px;margin:16px 0}
.question-num{color:var(--primary2);font-weight:700;font-size:.9rem;margin-bottom:8px}
.question-text{font-size:1.3rem;font-weight:700;margin-bottom:24px;line-height:1.5}
.question-options{display:grid;gap:12px}
.option-btn{padding:16px 20px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:1rem;text-align:left;cursor:pointer;transition:var(--transition);font-weight:500}
.option-btn:hover{border-color:var(--primary);background:var(--bg3)}
.option-btn.selected{border-color:var(--primary);background:rgba(124,58,237,.15)}
.option-btn.correct{border-color:var(--success);background:rgba(16,185,129,.15);color:var(--success)}
.option-btn.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:var(--danger)}

/* Leaderboard */
.leaderboard-item{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.leaderboard-rank{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem}
.rank-1{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000}
.rank-2{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#000}
.rank-3{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}
.rank-other{background:var(--bg3);color:var(--text3)}
.leaderboard-info{flex:1}
.leaderboard-name{font-weight:700}
.leaderboard-stats{color:var(--text3);font-size:.85rem}
.leaderboard-score{font-size:1.3rem;font-weight:800;color:var(--accent)}

/* Chat */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 140px)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat-msg{display:flex;gap:10px;max-width:75%;animation:fadeIn .3s ease}
.chat-msg.self{align-self:flex-end;flex-direction:row-reverse}
.chat-msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem}
.chat-msg-content{padding:10px 14px;border-radius:12px;font-size:.9rem}
.chat-msg:not(.self) .chat-msg-content{background:var(--bg3);border-bottom-left-radius:4px}
.chat-msg.self .chat-msg-content{background:var(--primary);border-bottom-right-radius:4px}
.chat-msg-meta{font-size:.7rem;color:var(--text4);margin-top:4px}
.chat-input-area{display:flex;gap:8px;padding:12px;background:var(--bg2);border-top:1px solid var(--border)}
.chat-input-area input{flex:1}

/* Achievements */
.achievement-card{display:flex;align-items:center;gap:16px;padding:20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);transition:var(--transition)}
.achievement-card.unlocked{border-color:var(--accent);background:rgba(245,158,11,.05)}
.achievement-card.locked{opacity:.5}
.achievement-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.achievement-info{flex:1}
.achievement-name{font-weight:700;font-size:1rem}
.achievement-desc{color:var(--text3);font-size:.85rem}
.achievement-progress{margin-top:6px;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.achievement-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px}

/* Groups */
.group-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;transition:var(--transition);cursor:pointer}
.group-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.group-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.group-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.group-name{font-weight:700;font-size:1.1rem}
.group-members{color:var(--text3);font-size:.85rem}

/* Profile */
.profile-header{display:flex;align-items:center;gap:24px;padding:24px;background:var(--bg2);border-radius:var(--radius2);border:1px solid var(--border);margin-bottom:24px}
.profile-avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:800;border:3px solid var(--primary)}
.profile-info{flex:1}
.profile-name{font-size:1.6rem;font-weight:800}
.profile-role{color:var(--primary2);font-weight:600}
.profile-stats{display:flex;gap:24px;margin-top:8px}
.profile-stat{text-align:center}
.profile-stat-value{font-size:1.3rem;font-weight:800;color:var(--accent)}
.profile-stat-label{font-size:.75rem;color:var(--text4)}

/* Admin */
.admin-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:24px;margin-bottom:20px}
.admin-section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Notifications */
.notif-panel{position:fixed;top:64px;right:0;width:360px;max-height:calc(100vh - 64px);background:var(--bg2);border-left:1px solid var(--border);z-index:1500;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.notif-panel.open{transform:translateX(0)}
.notif-item{padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--transition)}
.notif-item:hover{background:var(--bg3)}
.notif-item.unread{border-left:3px solid var(--primary)}
.notif-title{font-weight:600;font-size:.9rem}
.notif-text{color:var(--text3);font-size:.85rem;margin-top:4px}
.notif-time{color:var(--text4);font-size:.75rem;margin-top:4px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 20px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-weight:600;font-size:.9rem;white-space:nowrap}
.tab.active{background:var(--primary);color:#fff}

/* Progress */
.progress{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state-icon{font-size:4rem;margin-bottom:16px;opacity:.5}
.empty-state-title{font-size:1.3rem;font-weight:700;color:var(--text2);margin-bottom:8px}
.empty-state-text{margin-bottom:20px}

/* Loading */
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}

/* Responsive */
@media(max-width:768px){
.navbar{padding:0 16px}
.nav-links{display:none;position:fixed;top:64px;left:0;right:0;bottom:0;background:var(--bg2);flex-direction:column;padding:20px;z-index:999}
.nav-links.open{display:flex}
.nav-hamburger{display:block}
.main{padding:16px;margin-top:56px}
.hero-title{font-size:2rem}
.hero-sub{font-size:1rem}
.room-code-display{font-size:1.5rem;letter-spacing:4px}
.timer{font-size:2rem}
.profile-header{flex-direction:column;text-align:center}
.profile-stats{justify-content:center}
.notif-panel{width:100%}
.dash-grid{grid-template-columns:1fr}
.chat-msg{max-width:90%}
}

/* Confetti */
.confetti-piece{position:fixed;top:-10px;width:10px;height:10px;z-index:9999;animation:confetti 3s ease-in forwards;pointer-events:none}

/* Print */
@media print{.navbar,.toast-container,.notif-panel{display:none}.main{margin-top:0;padding:0}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast-container" id="toasts"></div>

<script>
// ==================== CONFIGURATION ====================
const CONFIG = {
  APP_NAME: 'Zakovat',
  APP_SUBTITLE: 'Interaktiv test platformasi',
  VERSION: '2.0.0',
  PEERJS_KEY: undefined, // uses default PeerJS cloud server
  MAX_QUESTIONS: 100,
  MAX_OPTIONS: 8,
  MIN_OPTIONS: 2,
  TIMER_DEFAULT: 30,
  TIMER_MAX: 300,
  RATE_LIMIT_MSG: 5000,
  RATE_LIMIT_TEST: 30000,
  MAX_MESSAGES_PER_MIN: 10,
  STORAGE_PREFIX: 'zakovat_',
  AUTO_SAVE_INTERVAL: 30000,
  INACTIVITY_TIMEOUT: 1800000,
};

// ==================== SECURITY MANAGER ====================
class SecurityManager {
  constructor() {
    this.rateLimits = {};
    this.sanitized = new WeakSet();
  }

  sanitize(str) {
    if (!str || typeof str !== 'string') return str;
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#x27;')
      .replace(/\//g, '&#x2F;');
  }

  sanitizeHTML(html) {
    const temp = document.createElement('div');
    temp.textContent = html;
    return temp.innerHTML;
  }

  validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  validatePhone(phone) {
    return /^\+?[\d\s\-()]{7,15}$/.test(phone);
  }

  validateUsername(name) {
    return name && name.length >= 3 && name.length <= 30 && /^[a-zA-Z0-9_\u0400-\u04FF\u0600-\u06FF]+$/.test(name);
  }

  async hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password + CONFIG.STORAGE_PREFIX);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async encryptData(data, key) {
    try {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(key), 'PBKDF2', false, ['deriveKey']);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const derivedKey = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, derivedKey, encoder.encode(JSON.stringify(data)));
      return { salt: Array.from(salt), iv: Array.from(iv), data: Array.from(new Uint8Array(encrypted)) };
    } catch (e) { return null; }
  }

  async decryptData(encData, key) {
    try {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(key), 'PBKDF2', false, ['deriveKey']);
      const derivedKey = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new Uint8Array(encData.salt), iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(encData.iv) }, derivedKey, new Uint8Array(encData.data));
      return JSON.parse(new TextDecoder().decode(decrypted));
    } catch (e) { return null; }
  }

  rateLimit(action, limit = CONFIG.RATE_LIMIT_MSG) {
    const now = Date.now();
    if (!this.rateLimits[action]) this.rateLimits[action] = [];
    this.rateLimits[action] = this.rateLimits[action].filter(t => now - t < limit);
    if (this.rateLimits[action].length >= CONFIG.MAX_MESSAGES_PER_MIN) return false;
    this.rateLimits[action].push(now);
    return true;
  }

  generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
  }

  generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  checkPasswordStrength(password) {
    let score = 0;
    if (password.length >= 8) score++;
    if (password.length >= 12) score++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
    if (/\d/.test(password)) score++;
    if (/[^a-zA-Z0-9]/.test(password)) score++;
    return { score, label: ['Juda zaif', 'Zaif', 'O\'rtacha', 'Yaxshi', 'Kuchli', 'Juda kuchli'][score], color: ['#ef4444', '#f59e0b', '#f59e0b', '#10b981', '#10b981', '#7c3aed'][score] };
  }
}

// ==================== STORAGE MANAGER ====================
class StorageManager {
  get(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(CONFIG.STORAGE_PREFIX + key);
      return item ? JSON.parse(item) : defaultValue;
    } catch { return defaultValue; }
  }

  set(key, value) {
    try {
      localStorage.setItem(CONFIG.STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    } catch { return false; }
  }

  remove(key) {
    localStorage.removeItem(CONFIG.STORAGE_PREFIX + key);
  }

  clear() {
    Object.keys(localStorage).filter(k => k.startsWith(CONFIG.STORAGE_PREFIX)).forEach(k => localStorage.removeItem(k));
  }
}

const storage = new StorageManager();

// ==================== NOTIFICATION MANAGER ====================
class NotificationManager {
  constructor() {
    this.notifications = storage.get('notifications', []);
    this.listeners = [];
  }

  add(type, title, text) {
    const notif = { id: security.generateId(), type, title, text, time: Date.now(), read: false };
    this.notifications.unshift(notif);
    if (this.notifications.length > 100) this.notifications = this.notifications.slice(0, 100);
    storage.set('notifications', this.notifications);
    this.listeners.forEach(fn => fn(notif));
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body: text, icon: '🎓' });
    }
    return notif;
  }

  markRead(id) {
    const n = this.notifications.find(n => n.id === id);
    if (n) { n.read = true; storage.set('notifications', this.notifications); }
  }

  markAllRead() {
    this.notifications.forEach(n => n.read = true);
    storage.set('notifications', this.notifications);
  }

  getUnread() { return this.notifications.filter(n => !n.read); }

  onChange(fn) { this.listeners.push(fn); }

  requestPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }
}

// ==================== TOAST SYSTEM ====================
function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
  toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, duration);
}

class AuthManager {
  constructor() {
    this.currentUser = storage.get('currentUser', null);
    this.users = storage.get('users', []);
    // Admin maxsus kodlari - faqat bu kod orqali admin bo'lish mumkin
    this.ADMIN_CODES = storage.get('adminCodes', ['ZAKOVAT2024', 'ADMIN777', 'SUPER123']);
  }

  verifyAdminCode(code) {
    return this.ADMIN_CODES.includes(code.toUpperCase());
  }

  addAdminCode(code) {
    if (!this.ADMIN_CODES.includes(code.toUpperCase())) {
      this.ADMIN_CODES.push(code.toUpperCase());
      storage.set('adminCodes', this.ADMIN_CODES);
    }
  }

  removeAdminCode(code) {
    this.ADMIN_CODES = this.ADMIN_CODES.filter(c => c !== code.toUpperCase());
    storage.set('adminCodes', this.ADMIN_CODES);
  }

  async register(username, email, password, role = 'student', adminCode = '') {
    if (!security.validateUsername(username)) return { ok: false, error: 'Foydalanuvchi nomi 3-30 belgi, faqat harflar, raqamlar va _' };
    if (!security.validateEmail(email)) return { ok: false, error: 'Email manzil noto\'g\'ri' };
    if (password.length < 6) return { ok: false, error: 'Parol kamida 6 belgi bo\'lishi kerak' };
    if (this.users.find(u => u.username === username)) return { ok: false, error: 'Bu foydalanuvchi nomi band' };
    if (this.users.find(u => u.email === email)) return { ok: false, error: 'Bu email band' };

    // Agar admin yoki o'qituvchi bo'lishni xohlasa, kod talab qilinadi
    let finalRole = 'student';
    if (role === 'admin' || role === 'teacher') {
      if (!adminCode) return { ok: false, error: 'Admin/O\'qituvchi bo\'lish uchun maxsus kod talab qilinadi' };
      if (!this.verifyAdminCode(adminCode)) return { ok: false, error: 'Admin kodi noto\'g\'ri! Admin bo\'lish uchun ruxsat kodingiz bo\'lishi kerak' };
      finalRole = role;
    }

    const hash = await security.hashPassword(password);
    const user = {
      id: security.generateId(),
      username,
      email,
      passwordHash: hash,
      role: finalRole,
      avatar: username[0].toUpperCase(),
      createdAt: Date.now(),
      stats: { testsCreated: 0, testsTaken: 0, totalScore: 0, correctAnswers: 0, totalAnswers: 0, streak: 0, bestStreak: 0, lastActive: Date.now() },
      achievements: [],
      groups: [],
      settings: { theme: 'dark', language: 'uz', notifications: true, sound: true }
    };

    this.users.push(user);
    storage.set('users', this.users);
    this.currentUser = user;
    storage.set('currentUser', user);
    notifManager.add('success', 'Xush kelibsiz!', `${username} muvaffaqiyatli ro'yxatdan o'tdi`);
    return { ok: true, user };
  }

  async login(username, password) {
    const user = this.users.find(u => u.username === username || u.email === username);
    if (!user) return { ok: false, error: 'Foydalanuvchi topilmadi' };
    const hash = await security.hashPassword(password);
    if (user.passwordHash !== hash) return { ok: false, error: 'Parol noto\'g\'ri' };
    this.currentUser = user;
    storage.set('currentUser', user);
    notifManager.add('info', 'Kirish', 'Tizimga muvaffaqiyatli kirdingiz');
    return { ok: true, user };
  }

  logout() {
    this.currentUser = null;
    storage.remove('currentUser');
    navigate('home');
  }

  updateProfile(updates) {
    if (!this.currentUser) return;
    Object.assign(this.currentUser, updates);
    const idx = this.users.findIndex(u => u.id === this.currentUser.id);
    if (idx >= 0) this.users[idx] = this.currentUser;
    storage.set('users', this.users);
    storage.set('currentUser', this.currentUser);
  }

  updateStats(updates) {
    if (!this.currentUser) return;
    Object.assign(this.currentUser.stats, updates);
    this.currentUser.stats.lastActive = Date.now();
    this.updateProfile({});
  }

  isLoggedIn() { return !!this.currentUser; }

  isAdmin() { return this.currentUser?.role === 'admin'; }
  isTeacher() { return this.currentUser?.role === 'teacher'; }
  isStaff() { return this.currentUser?.role === 'admin' || this.currentUser?.role === 'teacher'; }

  getAllUsers() { return this.users; }

  deleteUser(id) {
    this.users = this.users.filter(u => u.id !== id);
    storage.set('users', this.users);
  }
}

// ==================== TEST ENGINE ====================
class TestEngine {
  constructor() {
    this.tests = storage.get('tests', []);
    this.activeTest = null;
    this.activeRoom = null;
    this.peer = null;
    this.connections = {};
    this.testTimer = null;
    this.questionTimer = null;
    this.listeners = {};
  }

  createTest(testData) {
    const test = {
      id: security.generateId(),
      ...testData,
      createdBy: auth.currentUser?.id,
      createdByName: auth.currentUser?.username,
      createdAt: Date.now(),
      roomCode: security.generateRoomCode(),
      status: 'waiting',
      players: [],
      results: [],
      questionIndex: 0,
      settings: {
        shuffle: testData.shuffle ?? true,
        timer: testData.timer ?? CONFIG.TIMER_DEFAULT,
        showResults: testData.showResults ?? true,
        maxPlayers: testData.maxPlayers ?? 50,
        isPublic: testData.isPublic ?? false,
        ...testData.settings
      }
    };
    this.tests.push(test);
    storage.set('tests', this.tests);
    if (auth.currentUser) auth.updateStats({ testsCreated: auth.currentUser.stats.testsCreated + 1 });
    achievementManager.check();
    return test;
  }

  getTest(id) { return this.tests.find(t => t.id === id); }
  getTestByRoom(code) { return this.tests.find(t => t.roomCode === code && t.status !== 'finished'); }
  getPublicTests() { return this.tests.filter(t => t.settings.isPublic && t.status === 'waiting'); }
  getUserTests(userId) { return this.tests.filter(t => t.createdBy === userId); }

  startTest(testId) {
    const test = this.getTest(testId);
    if (!test) return null;
    test.status = 'active';
    test.startedAt = Date.now();
    test.questionIndex = 0;
    if (test.settings.shuffle) test.questions = [...test.questions].sort(() => Math.random() - 0.5);
    storage.set('tests', this.tests);
    return test;
  }

  submitAnswer(testId, questionIndex, answerIndex) {
    const test = this.getTest(testId);
    if (!test) return null;
    const question = test.questions[questionIndex];
    const isCorrect = question && question.correctAnswer === answerIndex;
    let result = { questionIndex, answerIndex, isCorrect, time: Date.now() };
    if (!test.results) test.results = [];
    const existing = test.results.findIndex(r => r.playerId === auth.currentUser?.id && r.questionIndex === questionIndex);
    if (existing >= 0) test.results[existing] = result;
    else test.results.push({ playerId: auth.currentUser?.id, playerName: auth.currentUser?.username, ...result });
    storage.set('tests', this.tests);
    return isCorrect;
  }

  finishTest(testId) {
    const test = this.getTest(testId);
    if (!test) return null;
    test.status = 'finished';
    test.finishedAt = Date.now();
    storage.set('tests', this.tests);
    // Calculate scores
    const playerScores = {};
    test.results.forEach(r => {
      if (!playerScores[r.playerId]) playerScores[r.playerId] = { name: r.playerName, score: 0, correct: 0, total: 0 };
      playerScores[r.playerId].total++;
      if (r.isCorrect) { playerScores[r.playerId].correct++; playerScores[r.playerId].score += 10; }
    });
    // Update user stats
    if (auth.currentUser) {
      const myScore = playerScores[auth.currentUser.id];
      if (myScore) {
        auth.updateStats({
          testsTaken: auth.currentUser.stats.testsTaken + 1,
          totalScore: auth.currentUser.stats.totalScore + myScore.score,
          correctAnswers: auth.currentUser.stats.correctAnswers + myScore.correct,
          totalAnswers: auth.currentUser.stats.totalAnswers + myScore.total,
        });
        achievementManager.check();
      }
    }
    return playerScores;
  }

  deleteTest(id) {
    this.tests = this.tests.filter(t => t.id !== id);
    storage.set('tests', this.tests);
  }

  // Testni URL orqali ulashish (yaratuvchi chiqib ketsa ham ishlaydi)
  encodeTestForShare(testId) {
    const test = this.getTest(testId);
    if (!test) return null;
    const shareData = {
      t: test.title,
      d: test.description || '',
      q: test.questions.map(q => ({
        t: q.text,
        o: q.options,
        c: q.correctAnswer,
        p: q.points || 10
      })),
      tm: test.timer || 30,
      mp: test.maxPlayers || 50,
      sh: test.shuffle ?? true,
      pub: test.settings?.isPublic ?? true,
      by: test.createdByName || '',
      v: 2
    };
    try {
      const json = JSON.stringify(shareData);
      const encoded = btoa(unescape(encodeURIComponent(json)));
      return encoded;
    } catch (e) { console.error('Encode error:', e); return null; }
  }

  decodeTestFromShare(encoded) {
    try {
      const json = decodeURIComponent(escape(atob(encoded)));
      const data = JSON.parse(json);
      if (!data.t || !data.q || !data.q.length) return null;
      const test = {
        id: security.generateId(),
        title: data.t,
        description: data.d,
        questions: data.q.map((q, i) => ({
          id: security.generateId(),
          text: q.t,
          type: 'multiple',
          options: q.o,
          correctAnswer: q.c,
          points: q.p || 10,
          explanation: ''
        })),
        timer: data.tm || 30,
        maxPlayers: data.mp || 50,
        shuffle: data.sh ?? true,
        isPublic: data.pub ?? true,
        createdBy: null,
        createdByName: data.by || 'Tashqi test',
        createdAt: Date.now(),
        roomCode: security.generateRoomCode(),
        status: 'waiting',
        players: [],
        results: [],
        questionIndex: 0,
        settings: {
          shuffle: data.sh ?? true,
          timer: data.tm || 30,
          showResults: true,
          maxPlayers: data.mp || 50,
          isPublic: data.pub ?? true
        },
        source: 'shared_link'
      };
      // Shared testni lokal bazaga saqlash
      this.tests.push(test);
      storage.set('tests', this.tests);
      return test;
    } catch (e) { console.error('Decode error:', e); return null; }
  }

  // Testni JSON faylga eksport qilish
  exportTestAsJSON(testId) {
    const test = this.getTest(testId);
    if (!test) return null;
    const exportData = {
      platform: 'Zakovat',
      version: CONFIG.VERSION,
      exportedAt: new Date().toISOString(),
      test: {
        title: test.title,
        description: test.description,
        questions: test.questions.map(q => ({
          text: q.text,
          options: q.options,
          correctAnswer: q.correctAnswer,
          points: q.points || 10
        })),
        timer: test.timer || 30,
        maxPlayers: test.maxPlayers || 50,
        shuffle: test.shuffle ?? true,
        isPublic: test.settings?.isPublic ?? true
      }
    };
    return JSON.stringify(exportData, null, 2);
  }

  // JSON fayldan test import qilish
  importTestFromJSON(jsonString) {
    try {
      const data = JSON.parse(jsonString);
      let questions = [];
      // Zakovat format
      if (data.test && data.test.questions) {
        questions = data.test.questions.map(q => ({
          id: security.generateId(),
          text: q.text,
          type: 'multiple',
          options: q.options,
          correctAnswer: q.correctAnswer,
          points: q.points || 10,
          explanation: q.explanation || ''
        }));
        const test = this.createTest({
          title: data.test.title,
          description: data.test.description || '',
          questions,
          timer: data.test.timer || 30,
          maxPlayers: data.test.maxPlayers || 50,
          shuffle: data.test.shuffle ?? true,
          isPublic: data.test.isPublic ?? true
        });
        return test;
      }
      // Oddiy format (questions array to'g'ridan-to'g'ri)
      if (Array.isArray(data)) {
        questions = data.map(q => ({
          id: security.generateId(),
          text: q.text || q.question || '',
          type: 'multiple',
          options: q.options || q.answers || [],
          correctAnswer: q.correctAnswer ?? q.correct ?? 0,
          points: q.points || 10,
          explanation: q.explanation || ''
        }));
        if (questions.length === 0) return null;
        const test = this.createTest({
          title: 'Import qilingan test',
          description: `${questions.length} ta savol`,
          questions,
          timer: 30,
          maxPlayers: 50,
          shuffle: true,
          isPublic: true
        });
        return test;
      }
      return null;
    } catch (e) { console.error('Import error:', e); return null; }
  }

  // Test kutubxonasi — barcha testlar (shu jumladan boshqalardan kelgan)
  getAllAvailableTests() {
    return this.tests.filter(t => t.status === 'waiting' || t.status === 'active');
  }

  // Testga odam qo'shish
  addPlayerToTest(testId, playerInfo) {
    const test = this.getTest(testId);
    if (!test) return false;
    if (!test.players) test.players = [];
    if (test.players.find(p => p.id === playerInfo.id)) return true; // allaqachon qo'shilgan
    if (test.players.length >= (test.maxPlayers || 50)) return false;
    test.players.push({ ...playerInfo, joinedAt: Date.now() });
    storage.set('tests', this.tests);
    return true;
  }

  // Taklif havolasini generatsiya qilish
  generateShareLink(testId) {
    const encoded = this.encodeTestForShare(testId);
    if (!encoded) return null;
    const baseUrl = window.location.origin + window.location.pathname;
    return `${baseUrl}#test/${encoded}`;
  }

  // WebRTC Multiplayer
  createRoom(testId, onPeerConnect, onPeerData) {
    const test = this.getTest(testId);
    if (!test) return;
    this.activeRoom = test;
    this.peer = new Peer('zakovat-' + test.roomCode, { debug: 0 });
    this.peer.on('open', id => {
      console.log('Room created:', id);
      showToast('Xona yaratildi: ' + test.roomCode, 'success');
    });
    this.peer.on('connection', conn => {
      conn.on('open', () => {
        this.connections[conn.peer] = conn;
        if (onPeerConnect) onPeerConnect(conn);
        // Send current test state
        conn.send({ type: 'test_state', test: { ...test, results: [] } });
      });
      conn.on('data', data => {
        if (onPeerData) onPeerData(conn, data);
      });
      conn.on('close', () => { delete this.connections[conn.peer]; });
    });
    this.peer.on('error', err => {
      console.error('Peer error:', err);
      if (err.type === 'unavailable-id') showToast('Bu xona kodi band, qayta urinib ko\'ring', 'error');
    });
  }

  joinRoom(roomCode, onConnect, onData) {
    this.peer = new Peer(undefined, { debug: 0 });
    this.peer.on('open', () => {
      const conn = this.peer.connect('zakovat-' + roomCode);
      conn.on('open', () => {
        this.connections[conn.peer] = conn;
        showToast('Xonaga qo\'shildingiz!', 'success');
        if (onConnect) onConnect(conn);
      });
      conn.on('data', data => {
        if (onData) onData(conn, data);
      });
      conn.on('close', () => { delete this.connections[conn.peer]; });
    });
    this.peer.on('error', err => {
      console.error('Peer error:', err);
      showToast('Xonaga qo\'shilishda xato', 'error');
    });
  }

  broadcastToRoom(data) {
    Object.values(this.connections).forEach(conn => {
      try { conn.send(data); } catch (e) { console.error('Broadcast error:', e); }
    });
  }

  leaveRoom() {
    Object.values(this.connections).forEach(conn => { try { conn.close(); } catch {} });
    this.connections = {};
    if (this.peer) { try { this.peer.destroy(); } catch {} this.peer = null; }
    this.activeRoom = null;
    if (this.testTimer) clearInterval(this.testTimer);
    if (this.questionTimer) clearInterval(this.questionTimer);
  }

  on(event, fn) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(fn);
  }

  emit(event, data) {
    (this.listeners[event] || []).forEach(fn => fn(data));
  }
}

class GroupManager {
  constructor() {
    this.groups = storage.get('groups', []);
  }

  create(name, description, icon = '📚') {
    const group = {
      id: security.generateId(),
      name,
      description,
      icon,
      createdBy: auth.currentUser?.id,
      createdByName: auth.currentUser?.username,
      members: [{ id: auth.currentUser?.id, name: auth.currentUser?.username, role: 'owner', joinedAt: Date.now() }],
      tests: [],
      messages: [],
      createdAt: Date.now(),
      inviteCode: security.generateRoomCode(),
      settings: { isPublic: false, maxMembers: 100, allowChat: true }
    };
    this.groups.push(group);
    storage.set('groups', this.groups);
    if (auth.currentUser) {
      auth.currentUser.groups = auth.currentUser.groups || [];
      auth.currentUser.groups.push(group.id);
      auth.updateProfile({ groups: auth.currentUser.groups });
      achievementManager.check();
    }
    return group;
  }

  join(inviteCode) {
    const group = this.groups.find(g => g.inviteCode === inviteCode);
    if (!group) return { ok: false, error: 'Guruh topilmadi' };
    if (group.members.find(m => m.id === auth.currentUser?.id)) return { ok: false, error: 'Siz bu guruhdasiz' };
    if (group.members.length >= group.settings.maxMembers) return { ok: false, error: 'Guruh to\'la' };
    group.members.push({ id: auth.currentUser?.id, name: auth.currentUser?.username, role: 'member', joinedAt: Date.now() });
    storage.set('groups', this.groups);
    if (auth.currentUser) {
      auth.currentUser.groups = auth.currentUser.groups || [];
      auth.currentUser.groups.push(group.id);
      auth.updateProfile({ groups: auth.currentUser.groups });
      achievementManager.check();
    }
    notifManager.add('success', 'Guruh', `${group.name} guruhiga qo'shildingiz`);
    return { ok: true, group };
  }

  leave(groupId) {
    const group = this.groups.find(g => g.id === groupId);
    if (!group) return;
    group.members = group.members.filter(m => m.id !== auth.currentUser?.id);
    storage.set('groups', this.groups);
    if (auth.currentUser) {
      auth.currentUser.groups = (auth.currentUser.groups || []).filter(id => id !== groupId);
      auth.updateProfile({ groups: auth.currentUser.groups });
    }
  }

  getById(id) { return this.groups.find(g => g.id === id); }
  getUserGroups() { return this.groups.filter(g => g.members.some(m => m.id === auth.currentUser?.id)); }
  addTest(groupId, testId) {
    const group = this.getById(groupId);
    if (group) { group.tests.push(testId); storage.set('groups', this.groups); }
  }
  addMessage(groupId, text) {
    const group = this.getById(groupId);
    if (group) {
      group.messages.push({ id: security.generateId(), userId: auth.currentUser?.id, userName: auth.currentUser?.username, text, time: Date.now() });
      if (group.messages.length > 500) group.messages = group.messages.slice(-500);
      storage.set('groups', this.groups);
    }
  }
  delete(id) {
    this.groups = this.groups.filter(g => g.id !== id);
    storage.set('groups', this.groups);
  }
}

      ]
    };
  }

  r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  generate(category, count = 5) {
    const cat = this.templates[category];
    if (!cat) return [];
    const questions = [];
    const used = new Set();
    for (let i = 0; i < Math.min(count, cat.length); i++) {
      let idx;
      do { idx = this.r(0, cat.length - 1); } while (used.has(idx) && used.size < cat.length);
      used.add(idx);
      const data = cat[idx].gen();
      // Shuffle options and track correct answer
      const optionsWithIndex = data.opts.map((opt, i) => ({ text: String(opt), originalIndex: i }));
      const shuffled = [...optionsWithIndex].sort(() => Math.random() - 0.5);
      const correctIndex = shuffled.findIndex(o => o.originalIndex === data.correct);
      questions.push({
        id: security.generateId(),
        text: data.q,
        type: 'multiple',
        options: shuffled.map(o => o.text),
        correctAnswer: correctIndex,
        category,
        points: 10,
        explanation: ''
      });
    }
    return questions;
  }

  generateMixed(count = 10) {
    const categories = Object.keys(this.templates);
    const perCategory = Math.ceil(count / categories.length);
    let all = [];
    categories.forEach(cat => { all = all.concat(this.generate(cat, perCategory)); });
    return all.sort(() => Math.random() - 0.5).slice(0, count);
  }

  getCategories() { return Object.keys(this.templates); }
}

// ==================== LEADERBOARD MANAGER ====================
class LeaderboardManager {
  getGlobal(period = 'all') {
    const users = auth.getAllUsers().filter(u => u.stats.testsTaken > 0);
    const now = Date.now();
    let filtered = users;
    if (period === 'week') filtered = users.filter(u => now - u.stats.lastActive < 7 * 86400000);
    if (period === 'month') filtered = users.filter(u => now - u.stats.lastActive < 30 * 86400000);
    return filtered.sort((a, b) => b.stats.totalScore - a.stats.totalScore);
  }

  getTestLeaderboard(testId) {
    const test = testEngine.getTest(testId);
    if (!test || !test.results) return [];
    const playerScores = {};
    test.results.forEach(r => {
      if (!playerScores[r.playerId]) playerScores[r.playerId] = { name: r.playerName, score: 0, correct: 0, total: 0, time: 0 };
      playerScores[r.playerId].total++;
      if (r.isCorrect) { playerScores[r.playerId].correct++; playerScores[r.playerId].score += 10; }
    });
    return Object.values(playerScores).sort((a, b) => b.score - a.score || b.correct - a.correct);
  }
}

function switchCreateTab(tab) {
  document.getElementById('createManual').style.display = tab === 'manual' ? 'block' : 'none';
  document.getElementById('createAI').style.display = tab === 'ai' ? 'block' : 'none';
  document.querySelectorAll('#createTabs .tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'manual' && i === 0) || (tab === 'ai' && i === 1));
  });
}

function handleCreateTest() {
  const title = document.getElementById('testTitle')?.value?.trim();
  if (!title) return showToast('Test nomini kiriting', 'error');
  const desc = document.getElementById('testDesc')?.value?.trim() || '';
  const timer = parseInt(document.getElementById('testTimer')?.value) || 30;
  const maxPlayers = parseInt(document.getElementById('testMaxPlayers')?.value) || 50;
  const shuffle = document.getElementById('testShuffle')?.checked ?? true;
  const isPublic = document.getElementById('testPublic')?.checked ?? false;

  const qTexts = document.querySelectorAll('.q-text');
  const questions = [];
  let valid = true;
  qTexts.forEach(el => {
    const qId = el.dataset.q;
    const text = el.value.trim();
    if (!text) { valid = false; return; }
    const opts = [];
    document.querySelectorAll(`.q-opt[data-q="${qId}"]`).forEach(opt => {
      if (opt.value.trim()) opts.push(opt.value.trim());
    });
    if (opts.length < 2) { valid = false; return; }
    const correct = parseInt(document.querySelector(`.q-correct[data-q="${qId}"]`)?.value) || 0;
    questions.push({ id: security.generateId(), text, type: 'multiple', options: opts, correctAnswer: Math.min(correct, opts.length-1), points: 10, explanation: '' });
  });

  if (!valid || questions.length === 0) return showToast('Barcha savollarni to\'ldiring (kamida 2 variant)', 'error');

  const test = testEngine.createTest({ title, description: desc, questions, timer, maxPlayers, shuffle, isPublic });
  showToast('Test muvaffaqiyatli yaratildi!', 'success');
  navigate('test-room', { testId: test.id });
}

function handleAIGenerate() {
  const title = document.getElementById('aiTestTitle')?.value?.trim();
  if (!title) return showToast('Test nomini kiriting', 'error');
  const category = document.getElementById('aiCategory')?.value || 'mixed';
  const count = parseInt(document.getElementById('aiCount')?.value) || 10;
  const timer = parseInt(document.getElementById('aiTimer')?.value) || 30;

  const questions = category === 'mixed' ? questionGen.generateMixed(count) : questionGen.generate(category, count);
  if (questions.length === 0) return showToast('Savollar generatsiya qilinmadi', 'error');

  const test = testEngine.createTest({ title, description: `AI generatsiya: ${category}`, questions, timer, maxPlayers: 50, shuffle: true, isPublic: true });
  showToast(`${questions.length} ta savol generatsiya qilindi!`, 'success');
  navigate('test-room', { testId: test.id });
}

  if (!code || code.length < 4) return showToast('Xona kodini to\'g\'ri kiriting', 'error');

  if (test.status === 'finished') return showToast('Test tugagan', 'warning');
  navigate('test-room', { testId: test.id });
}

// Active test state
let activeTestState = { testId: null, questionIndex: 0, answers: [], timeLeft: 0, totalTime: 0, isFinished: false };

function startActiveTest(testId) {
  const test = testEngine.startTest(testId);
  if (!test) return showToast('Testni boshlashda xato', 'error');
  activeTestState = { testId, questionIndex: 0, answers: [], timeLeft: test.timer, totalTime: test.timer, isFinished: false };
  navigate('test-active', { testId });
}

function renderActiveTest() {
  const test = testEngine.getTest(pageParams.testId || activeTestState.testId);
  if (!test) return '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-title">Test topilmadi</div></div>';
  if (activeTestState.isFinished) return renderTestResults();

  const q = test.questions[activeTestState.questionIndex];
  if (!q) return renderTestResults();

  const progress = ((activeTestState.questionIndex) / test.questions.length * 100);
  const timePercent = (activeTestState.timeLeft / activeTestState.totalTime * 100);

  return `<div class="animate-fade" style="max-width:700px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span class="badge badge-primary">${activeTestState.questionIndex + 1} / ${test.questions.length}</span>
      <span class="badge ${timePercent<30?'badge-danger':'badge-info'}">⏱️ ${activeTestState.timeLeft}s</span>
    </div>
    <div class="progress" style="margin-bottom:8px"><div class="progress-fill" style="width:${progress}%;background:linear-gradient(90deg,var(--primary),var(--primary2))"></div></div>
    <div class="timer-bar"><div class="timer-bar-fill" style="width:${timePercent}%;background:${timePercent<30?'var(--danger)':'var(--primary)'}"></div></div>

    <div class="question-card">
      <div class="question-num">Savol ${activeTestState.questionIndex + 1}</div>
      <div class="question-text">${security.sanitizeHTML(q.text)}</div>
      <div class="question-options">
        ${q.options.map((opt, i) => `<button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">${String.fromCharCode(65+i)}) ${security.sanitizeHTML(opt)}</button>`).join('')}
      </div>
    </div>

    <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
      <button class="btn btn-secondary" onclick="prevQuestion()" ${activeTestState.questionIndex===0?'disabled':''}>← Oldingi</button>
      <button class="btn btn-primary" onclick="nextQuestion()">${activeTestState.questionIndex===test.questions.length-1?'Tugatish':'Keyingi →'}</button>
    </div>
  </div>`;
}

function selectAnswer(idx) {
  const test = testEngine.getTest(activeTestState.testId);
  if (!test) return;
  const q = test.questions[activeTestState.questionIndex];
  activeTestState.answers[activeTestState.questionIndex] = idx;
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
}

function prevQuestion() {
  if (activeTestState.questionIndex > 0) {
    activeTestState.questionIndex--;
    renderApp();
    restoreSelectedAnswer();
  }
}

function nextQuestion() {
  const test = testEngine.getTest(activeTestState.testId);
  if (!test) return;
  const answer = activeTestState.answers[activeTestState.questionIndex];
  if (answer === undefined) return showToast('Javobni tanlang', 'warning');

  testEngine.submitAnswer(activeTestState.testId, activeTestState.questionIndex, answer);

  if (activeTestState.questionIndex < test.questions.length - 1) {
    activeTestState.questionIndex++;
    activeTestState.timeLeft = activeTestState.totalTime;
    renderApp();
    restoreSelectedAnswer();
  } else {
    finishActiveTest();
  }
}

function restoreSelectedAnswer() {
  const ans = activeTestState.answers[activeTestState.questionIndex];
  if (ans !== undefined) {
    setTimeout(() => {
      const btn = document.getElementById(`opt-${ans}`);
      if (btn) btn.classList.add('selected');
    }, 50);
  }
}

function finishActiveTest() {
  activeTestState.isFinished = true;
  const scores = testEngine.finishTest(activeTestState.testId);
  showConfetti();
  navigate('test-results', { testId: activeTestState.testId });
}

function renderTestResults() {
  const test = testEngine.getTest(pageParams.testId || activeTestState.testId);
  if (!test) return '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-title">Natija topilmadi</div></div>';

  const leaderboard = leaderboardManager.getTestLeaderboard(test.id);
  const myResult = leaderboard.find(p => p.name === auth.currentUser?.username) || { score: 0, correct: 0, total: test.questions.length };
  const percent = myResult.total > 0 ? Math.round(myResult.correct / myResult.total * 100) : 0;

  return `<div class="animate-fade" style="max-width:700px;margin:0 auto">
    <div class="card" style="text-align:center;margin-bottom:20px">
      <div style="font-size:4rem;margin-bottom:12px">${percent>=80?'🏆':percent>=60?'⭐':'💪'}</div>
      <h2>Test tugadi!</h2>
      <p style="color:var(--text3);margin:8px 0">${security.sanitizeHTML(test.title)}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:20px 0">
        <div><div style="font-size:2rem;font-weight:800;color:var(--accent)">${myResult.score}</div><div style="color:var(--text3);font-size:.85rem">Ball</div></div>
        <div><div style="font-size:2rem;font-weight:800;color:var(--success)">${percent}%</div><div style="color:var(--text3);font-size:.85rem">To'g'ri</div></div>
        <div><div style="font-size:2rem;font-weight:800;color:var(--primary2)">${myResult.correct}/${myResult.total}</div><div style="color:var(--text3);font-size:.85rem">Javoblar</div></div>
      </div>
    </div>

    ${leaderboard.length?`<div class="card" style="margin-bottom:20px">
      <h3 style="margin-bottom:16px">🏆 Reyting</h3>
      ${leaderboard.map((p,i)=>`<div class="leaderboard-item">
        <div class="leaderboard-rank ${i<3?'rank-'+(i+1):'rank-other'}">${i+1}</div>
        <div class="leaderboard-info"><div class="leaderboard-name">${security.sanitizeHTML(p.name)}</div><div class="leaderboard-stats">${p.correct}/${p.total} to'g'ri</div></div>
        <div class="leaderboard-score">${p.score}</div>
      </div>`).join('')}
    </div>`:''}

    <div style="display:flex;gap:12px;justify-content:center">
      <button class="btn btn-primary" onclick="navigate('dashboard')">Dashboard</button>
      <button class="btn btn-secondary" onclick="navigate('leaderboard')">Global reyting</button>
    </div>
  </div>`;
}

function updateProfileInfo() {
  const username = document.getElementById('editUsername')?.value?.trim();
  const email = document.getElementById('editEmail')?.value?.trim();
  if (!security.validateUsername(username)) return showToast('Noto\'g\'ri foydalanuvchi nomi', 'error');
  if (!security.validateEmail(email)) return showToast('Noto\'g\'ri email', 'error');
  auth.updateProfile({ username, email, avatar: username[0].toUpperCase() });
  showToast('Profil yangilandi!', 'success');
  renderApp();
}

async function changePassword() {
  const oldPass = document.getElementById('oldPass')?.value;
  const newPass = document.getElementById('newPass')?.value;
  if (!oldPass || !newPass) return showToast('Maydonlarni to\'ldiring', 'error');
  const oldHash = await security.hashPassword(oldPass);
  if (oldHash !== auth.currentUser.passwordHash) return showToast('Hozirgi parol noto\'g\'ri', 'error');
  if (newPass.length < 6) return showToast('Yangi parol kamida 6 belgi', 'error');
  const newHash = await security.hashPassword(newPass);
  auth.updateProfile({ passwordHash: newHash });
  showToast('Parol o\'zgartirildi!', 'success');
}

function addNewAdminCode() {
  const input = document.getElementById('newAdminCode');

  const code = input.value.trim().toUpperCase();

function changeUserRole(userId, newRole) {
  if (!auth.isAdmin()) return showToast('Faqat admin rol o\'zgartira oladi', 'error');
  const users = auth.getAllUsers();
  const user = users.find(u => u.id === userId);
  if (!user) return;
  const oldRole = user.role;
  user.role = newRole;
  storage.set('users', users);
  // Agar bu foydalanuvchi hozir tizimda bo'lsa, uning ma'lumotlarini yangilash
  if (auth.currentUser?.id === userId) {
    auth.currentUser.role = newRole;
    storage.set('currentUser', auth.currentUser);
  }
  renderApp();
  showToast(`${user.username} roli o'zgartirildi: ${oldRole} → ${newRole}`, 'success');
}

function switchLibTab(tab) {
  ['all','my','other'].forEach(t => {
    const el = document.getElementById('lib' + t.charAt(0).toUpperCase() + t.slice(1));
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('#libTabs .tab').forEach((t, i) => {
    t.classList.toggle('active', (tab==='all'&&i===0)||(tab==='my'&&i===1)||(tab==='other'&&i===2));
  });
}

function filterLibrary() {
  const query = (document.getElementById('libSearch')?.value||'').toLowerCase();
  document.querySelectorAll('#libAll .card, #libMy .card, #libOther .card').forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(query) ? '' : 'none';
  });
}

    <div style="margin-bottom:20px">
      <h4 style="margin-bottom:8px">📋 Usul 1: Xona kodi</h4>
      <div style="display:flex;gap:8px">
        <input class="form-input" value="${test.roomCode}" readonly style="text-align:center;font-size:1.3rem;letter-spacing:6px;font-weight:800">
        <button class="btn btn-primary" onclick="copyToClipboard('${test.roomCode}')">Nusxa</button>
      </div>
      <p style="color:var(--text4);font-size:.8rem;margin-top:4px">Do'stlar "Test topshirish" sahifasida ushbu kodni kiritsa, sizga qo'shiladi</p>
    </div>

    <div style="margin-bottom:20px">
      <h4 style="margin-bottom:8px">🔗 Usul 2: Taklif havolasi</h4>
      <div style="background:var(--bg);padding:12px;border-radius:8px;margin-bottom:8px">
        <code style="font-size:.8rem;color:var(--primary2);word-break:break-all">${security.sanitizeHTML(link||'')}</code>
      </div>
      <button class="btn btn-success btn-block" onclick="copyToClipboard('${link||''}')">📋 Havolani nusxalash</button>
      <p style="color:var(--text4);font-size:.8rem;margin-top:4px">✅ Yaratuvchi chiqib ketsa ham test ishlaydi — test havolaga shifrlanadi</p>
    </div>

    <div style="margin-bottom:20px">
      <h4 style="margin-bottom:8px">📱 Usul 3: Telegram/WhatsApp</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn btn-secondary" onclick="shareViaTelegram('${testId}')">📤 Telegram</button>
        <button class="btn btn-secondary" onclick="shareViaWhatsApp('${testId}')">📤 WhatsApp</button>
      </div>
    </div>

    <div>
      <h4 style="margin-bottom:8px">📥 Usul 4: JSON fayl</h4>
      <button class="btn btn-secondary btn-block" onclick="exportTest('${testId}')">📥 Test faylini yuklash</button>
      <p style="color:var(--text4);font-size:.8rem;margin-top:4px">Faylni do'stlarga yuboring, ular "Import" orqali yuklashdi</p>
    </div>
  `);
}

function shareViaTelegram(testId) {
  const link = testEngine.generateShareLink(testId);
  const test = testEngine.getTest(testId);
  if (!link || !test) return;
  const text = encodeURIComponent(`🎓 Zakovat test: ${test.title}\n📝 ${test.questions.length} savol\n🔗 Qo'shish: ${link}`);
  window.open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${text}`, '_blank');
}

function shareViaWhatsApp(testId) {
  const link = testEngine.generateShareLink(testId);
  const test = testEngine.getTest(testId);
  if (!link || !test) return;
  const text = encodeURIComponent(`🎓 Zakovat test: ${test.title}\n📝 ${test.questions.length} savol\n🔗 Qo'shish: ${link}`);
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

function exportTest(testId) {
  const json = testEngine.exportTestAsJSON(testId);
  if (!json) return showToast('Eksportda xato', 'error');
  const test = testEngine.getTest(testId);
  const filename = (test?.title || 'test').replace(/[^a-zA-Z0-9]/g, '_') + '.json';
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast('Test fayli yuklandi: ' + filename, 'success');
}

function showImportModal() {
  showModal('📤 Test import qilish', `
    <div style="margin-bottom:20px">
      <h4 style="margin-bottom:8px">Fayldan import</h4>
      <input type="file" id="importFile" accept=".json" class="form-input" style="padding:12px">
    </div>
    <div style="margin-bottom:20px">
      <h4 style="margin-bottom:8px">Yoki JSON matnini qo'yish</h4>
      <textarea class="form-input" id="importJSON" placeholder='JSON matnini bu yerga qo\'ying...' style="min-height:150px;font-size:.85rem"></textarea>
    </div>
  `, `<button class="btn btn-primary" onclick="handleImportTest()">Import qilish</button>`);
}

function handleImportTest() {
  // Fayldan o'qish
  const fileInput = document.getElementById('importFile');
  const jsonText = document.getElementById('importJSON')?.value?.trim();
  
  if (fileInput?.files?.length > 0) {
    const reader = new FileReader();
    reader.onload = e => {
      const test = testEngine.importTestFromJSON(e.target.result);
      if (test) {
        document.querySelector('.modal-overlay')?.remove();
        showToast('Test muvaffaqiyatli import qilindi!', 'success');
        navigate('test-room', { testId: test.id });
      } else {
        showToast('Import qilishda xato — fayl formati noto\'g\'ri', 'error');
      }
    };
    reader.readAsText(fileInput.files[0]);
  } else if (jsonText) {
    const test = testEngine.importTestFromJSON(jsonText);
    if (test) {
      document.querySelector('.modal-overlay')?.remove();
      showToast('Test muvaffaqiyatli import qilindi!', 'success');
      navigate('test-room', { testId: test.id });
    } else {
      showToast('Import qilishda xato — JSON formati noto\'g\'ri', 'error');
    }
  } else {
    showToast('Fayl yoki JSON matnini kiriting', 'error');
  }
}

function duplicateTest(testId) {
  const test = testEngine.getTest(testId);
  if (!test) return;
  const newTest = testEngine.createTest({
    title: test.title + ' (nusxa)',
    description: test.description,
    questions: test.questions.map(q => ({...q, id: security.generateId()})),
    timer: test.timer,
    maxPlayers: test.maxPlayers,
    shuffle: test.shuffle,
    isPublic: test.settings?.isPublic ?? true
  });
  showToast('Test nusxalandi!', 'success');
  navigate('test-room', { testId: newTest.id });
}

function addPlayerManual(testId) {
  showModal('👤 Odam qo\'shish', `
    <p style="color:var(--text3);margin-bottom:16px">Testga qo'shmoqchi bo'lgan odamning ismini kiriting</p>
    <div class="form-group">
      <label class="form-label">Ism</label>
      <input class="form-input" id="addPlayerName" placeholder="Foydalanuvchi ismi...">
    </div>
  `, `<button class="btn btn-primary" onclick="handleAddPlayer('${testId}')">Qo'shish</button>`);
}

function handleAddPlayer(testId) {
  const name = document.getElementById('addPlayerName')?.value?.trim();
  if (!name) return showToast('Ismni kiriting', 'error');
  const added = testEngine.addPlayerToTest(testId, { id: security.generateId(), name, role: 'player' });
  if (added) {
    document.querySelector('.modal-overlay')?.remove();
    showToast(name + ' testga qo\'shildi!', 'success');
    renderApp();
  } else {
    showToast('Qo\'shishda xato (test to\'la bo\'lishi mumkin)', 'error');
  }
}
function showModal(title, content, footer = '') {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal">
    <div class="modal-header"><h3 class="modal-title">${title}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body">${content}</div>
    ${footer?`<div class="modal-footer">${footer}</div>`:''}
  </div>`;
  document.body.appendChild(overlay);
}

function showCreateGroupModal() {
  showModal('Yangi guruh yaratish', `
    <div class="form-group"><label class="form-label">Guruh nomi</label><input class="form-input" id="newGroupName" placeholder="Guruh nomi..."></div>
    <div class="form-group"><label class="form-label">Tavsif</label><textarea class="form-input" id="newGroupDesc" placeholder="Guruh haqida..."></textarea></div>
    <div class="form-group"><label class="form-label">Ikonka</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${['📚','🎓','🔬','💻','🎨','⚽','🎵','🌍','📐','🧪'].map(i=>`<button class="btn btn-sm btn-secondary" onclick="document.getElementById('newGroupIcon').value='${i}';this.parentElement.querySelectorAll('button').forEach(b=>b.style.borderColor='');this.style.borderColor='var(--primary)'">${i}</button>`).join('')}
      <input type="hidden" id="newGroupIcon" value="📚"></div>
    </div>
  `, `<button class="btn btn-primary" onclick="handleCreateGroup()">Yaratish</button>`);
}

function handleCreateGroup() {
  const name = document.getElementById('newGroupName')?.value?.trim();
  const desc = document.getElementById('newGroupDesc')?.value?.trim();
  const icon = document.getElementById('newGroupIcon')?.value || '📚';
  if (!name) return showToast('Guruh nomini kiriting', 'error');
  const group = groupManager.create(name, desc, icon);
  document.querySelector('.modal-overlay')?.remove();
  showToast('Guruh yaratildi!', 'success');
  navigate('group-detail', { groupId: group.id });
}

function showJoinGroupModal() {
  showModal('Guruhga qo\'shilish', `
    <div class="form-group"><label class="form-label">Taklif kodi</label><input class="form-input" id="joinGroupCode" placeholder="Taklif kodini kiriting..." maxlength="6" style="text-transform:uppercase"></div>
  `, `<button class="btn btn-primary" onclick="handleJoinGroup()">Qo'shilish</button>`);
}

function handleJoinGroup() {
  const code = document.getElementById('joinGroupCode')?.value?.trim().toUpperCase();
  if (!code) return showToast('Taklif kodini kiriting', 'error');
  const result = groupManager.join(code);
  if (result.ok) {
    document.querySelector('.modal-overlay')?.remove();
    showToast('Guruhga qo\'shildingiz!', 'success');
    navigate('group-detail', { groupId: result.group.id });
  } else {
    showToast(result.error, 'error');
  }
}

// ==================== EVENT HANDLERS ====================
async function handleLogin() {
  const user = document.getElementById('loginUser')?.value?.trim();
  const pass = document.getElementById('loginPass')?.value;
  if (!user || !pass) return showToast('Maydonlarni to\'ldiring', 'error');
  if (!security.rateLimit('login')) return showToast('Juda ko\'p urinish. Biroz kuting', 'warning');
  const result = await auth.login(user, pass);
  if (result.ok) {
    const role = result.user.role;
    const roleEmoji = role === 'admin' ? '🛡️' : role === 'teacher' ? '👨‍🏫' : '🎓';
    const roleName = role === 'admin' ? 'Admin' : role === 'teacher' ? 'O\'qituvchi' : 'O\'quvchi';
    showToast(`${roleEmoji} Xush kelibsiz, ${result.user.username}! (${roleName})`, 'success');
    navigate('dashboard');
  } else showToast(result.error, 'error');
}

async function handleRegister() {
  const user = document.getElementById('regUser')?.value?.trim();
  const email = document.getElementById('regEmail')?.value?.trim();
  const pass = document.getElementById('regPass')?.value;
  const passConfirm = document.getElementById('regPassConfirm')?.value;
  const role = document.getElementById('regRole')?.value || 'student';
  const adminCode = document.getElementById('regAdminCode')?.value?.trim() || '';

  if (!user || !email || !pass) return showToast('Barcha maydonlarni to\'ldiring', 'error');
  if (pass !== passConfirm) return showToast('Parollar mos kelmayapti!', 'error');
  if (pass.length < 6) return showToast('Parol kamida 6 belgi bo\'lishi kerak', 'error');

  // Birinchi foydalanuvchi avtomatik admin
  const isFirstChild = auth.getAllUsers().length === 0;
  const finalRole = isFirstChild ? 'admin' : role;
  const finalAdminCode = isFirstChild ? '' : adminCode;

  const result = await auth.register(user, email, pass, finalRole, finalAdminCode);
  if (result.ok) {
    if (isFirstChild) {
      showToast('🛡️ Admin sifatida ro\'yxatdan o\'tdingiz!', 'success');
    } else if (finalRole === 'student') {
      showToast('🎓 O\'quvchi sifatida ro\'yxatdan o\'tdingiz!', 'success');
    } else if (finalRole === 'teacher') {
      showToast('👨‍🏫 O\'qituvchi sifatida ro\'yxatdan o\'tdingiz!', 'success');
    } else if (finalRole === 'admin') {
      showToast('🛡️ Admin sifatida ro\'yxatdan o\'tdingiz!', 'success');
    }
    navigate('dashboard');
  } else {
    showToast(result.error, 'error');
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Nusxalandi: ' + text, 'success')).catch(() => showToast('Nusxalashda xato', 'error'));
}

function attachEvents() {
  // Close notification panel on outside click
  document.addEventListener('click', e => {
    const panel = document.getElementById('notifPanel');
    if (panel?.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('.nav-user')) {
      panel.classList.remove('open');
    }
  });

  // Keyboard shortcuts
  document.onkeydown = e => {
    if (e.key === 'Escape') {
      document.querySelector('.modal-overlay')?.remove();
      document.getElementById('notifPanel')?.classList.remove('open');
    }
  };
}

// ==================== AUTO-SAVE & STREAK ====================
setInterval(() => {
  if (auth.currentUser) {
    const last = auth.currentUser.stats.lastActive;
    const now = Date.now();
    const daysDiff = Math.floor((now - last) / 86400000);
    if (daysDiff === 1) {
      auth.updateStats({ streak: auth.currentUser.stats.streak + 1, bestStreak: Math.max(auth.currentUser.stats.streak + 1, auth.currentUser.stats.bestStreak || 0) });
      achievementManager.check();
    } else if (daysDiff > 1) {
      auth.updateStats({ streak: 1 });
    }
  }
}, CONFIG.AUTO_SAVE_INTERVAL);

// ==================== INACTIVITY CHECK ====================
let inactivityTimer;
function resetInactivity() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    if (auth.isLoggedIn()) {
      showToast('Muddatsiz faollik tufayli chiqdingiz', 'warning');
      auth.logout();
    }
  }, CONFIG.INACTIVITY_TIMEOUT);
}
['mousedown','mousemove','keypress','scroll','touchstart'].forEach(e => document.addEventListener(e, resetInactivity, { passive: true }));

// ==================== SERVICE WORKER (PWA) ====================
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('Offline'))));`;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ==================== INIT ====================
notifManager.requestPermission();

    // URL da test/ bo'lsa, avtomatik test-link sahifasiga o'tish
    if (hash.startsWith('test/')) {
      currentPage = 'test-link';
      pageParams = { encoded: hash.slice(5) };
    } else {
      currentPage = hash;
    }

  renderApp();
});
</script>
